services:

  bdcreation:
    build: ./bd/
    container_name: bd-creation
    restart: no
    depends_on:
      mysql:
        condition: service_healthy

  rmi:
    build: ./rmi/
    container_name: rmi_server
    restart: always
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9090"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  mysql:
    image: mysql:latest
    container_name: archi-bd
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      start_period: 45s
    env_file:
      - bd.env
    ports:
      - "3306:3306"
    restart: always
    volumes:
      - ./bd/mysql:/var/lib/mysql